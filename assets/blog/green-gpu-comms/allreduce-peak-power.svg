<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="A100 All-Reduce peak power: NCCL 142.95 W, CUDA IPC 195 W; CUDA-Aware MPI not quoted">
  <rect width="760" height="230" fill="#ffffff"/>
  <text x="20" y="24" font-weight="600" fill="#1a1a1a">A100 All-Reduce: peak GPU power</text>

  <!-- x = 160 + 2.5 W -->
  <g stroke="#e3e3e3">
    <line x1="285" y1="40" x2="285" y2="160"/><line x1="410" y1="40" x2="410" y2="160"/>
    <line x1="535" y1="40" x2="535" y2="160"/><line x1="660" y1="40" x2="660" y2="160"/>
  </g>
  <g fill="#1a1a1a" text-anchor="end">
    <text x="150" y="69">NCCL</text><text x="150" y="109">CUDA IPC</text><text x="150" y="149">CUDA-Aware MPI</text>
  </g>
  <rect x="160" y="52" width="357.4" height="26" fill="#3b6ea5"/>
  <rect x="160" y="92" width="487.5" height="26" fill="#1f4470"/>
  <g font-size="11" fill="#1a1a1a">
    <text x="525" y="69">142.95 W</text>
    <text x="655" y="109">195 W</text>
  </g>
  <text x="170" y="149" font-size="11" fill="#5a5a5a">peak not quoted; falls back to PCIe under congestion</text>

  <g stroke="#1a1a1a"><line x1="160" y1="160" x2="660" y2="160"/></g>
  <g fill="#5a5a5a" font-size="11" text-anchor="middle">
    <text x="160" y="176">0</text><text x="285" y="176">50</text><text x="410" y="176">100</text>
    <text x="535" y="176">150</text><text x="660" y="176">200 W</text>
  </g>

  <text x="20" y="202" fill="#1a1a1a">CUDA IPC draws more at peak but finishes sooner, so it uses fewer joules overall.</text>
  <text x="20" y="220" font-size="10" fill="#5a5a5a">Peak values measured on Snellius A100 nodes.</text>
</svg>
