<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Reusable pipeline from raw input to domain JSON, with schema definition, mapping rules and examples swapped per record type">
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <text x="20" y="24" font-weight="600" fill="#1a1a1a">One platform, configured per record type</text>
  <text x="60" y="42" font-size="11" fill="#5a5a5a">Reusable</text>
  <text x="470" y="152" font-size="11" fill="#5a5a5a">Changes per record type</text>

  <rect x="20" y="50" width="26" height="320" fill="#1f4470"/>
  <text transform="translate(37,210) rotate(-90)" text-anchor="middle" fill="#ffffff" font-size="11">evaluation framework (per-stage metrics)</text>

  <rect x="60" y="50" width="300" height="40" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.2"/>
  <g fill="#3b6ea5">
    <rect x="60" y="106" width="300" height="40"/><rect x="60" y="162" width="300" height="40"/>
    <rect x="60" y="274" width="300" height="40"/><rect x="60" y="330" width="300" height="40"/>
  </g>
  <rect x="60" y="218" width="300" height="40" fill="#1f4470"/>
  <text x="210" y="74" text-anchor="middle" fill="#1a1a1a">Raw input (PDF / OCR / XML)</text>
  <g fill="#ffffff" text-anchor="middle">
    <text x="210" y="130">Document parser → section detector</text>
    <text x="210" y="186">Extraction engine: LLM + constrained decoding</text>
    <text x="210" y="242">Canonical metadata object</text>
    <text x="210" y="298">Validation and confidence scoring</text>
    <text x="210" y="354">Domain mapper → JSON Schema output</text>
  </g>

  <g fill="#fbf0d9" stroke="#e0a030" stroke-width="1.5">
    <rect x="470" y="164" width="260" height="36"/><rect x="470" y="220" width="260" height="36"/>
    <rect x="470" y="332" width="260" height="36"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="600" y="186">Examples</text><text x="600" y="242">Schema definition</text>
    <text x="600" y="354">Mapping rules</text>
  </g>

  <g stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="210" y1="90" x2="210" y2="105"/><line x1="210" y1="146" x2="210" y2="161"/>
    <line x1="210" y1="202" x2="210" y2="217"/><line x1="210" y1="258" x2="210" y2="273"/>
    <line x1="210" y1="314" x2="210" y2="329"/>
  </g>
  <g stroke="#e0a030" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="470" y1="182" x2="361" y2="182"/>
    <line x1="470" y1="238" x2="361" y2="292"/>
    <line x1="470" y1="250" x2="361" y2="342"/>
    <line x1="470" y1="356" x2="361" y2="356"/>
  </g>

  <text x="20" y="396" font-size="10" fill="#5a5a5a">Schematic, not measured. New record type: swap the amber inputs, keep the blue stages.</text>
</svg>
