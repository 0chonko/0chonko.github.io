<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Hardware counters are fresh only in short windows. Naive rapid polling mostly reads cached values; 25 ms-spaced transfers and profiler samples land on fresh windows">
  <defs>
    <pattern id="idle" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f1f1f1"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b5b5b5" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>

  <!-- 25 ms period = 200 px, starting at x = 160 -->
  <g stroke="#1a1a1a">
    <line x1="160" y1="22" x2="360" y2="22"/><line x1="160" y1="17" x2="160" y2="27"/><line x1="360" y1="17" x2="360" y2="27"/>
  </g>
  <rect x="236" y="13" width="48" height="16" fill="#ffffff"/>
  <text x="260" y="26" text-anchor="middle" font-size="11" fill="#1a1a1a">25 ms</text>

  <g fill="#1a1a1a" text-anchor="end">
    <text x="150" y="56">Hardware counters</text>
    <text x="150" y="104">Naive rapid poll</text>
    <text x="150" y="152">Host CPU</text>
    <text x="150" y="200">Profiler thread</text>
  </g>

  <!-- hardware: fresh / cached -->
  <g stroke="#ffffff">
    <rect x="160" y="40" width="30" height="24" fill="#1f4470"/><rect x="190" y="40" width="170" height="24" fill="url(#idle)"/>
    <rect x="360" y="40" width="30" height="24" fill="#1f4470"/><rect x="390" y="40" width="170" height="24" fill="url(#idle)"/>
    <rect x="560" y="40" width="30" height="24" fill="#1f4470"/><rect x="590" y="40" width="150" height="24" fill="url(#idle)"/>
  </g>
  <g fill="#5a5a5a" font-size="11" text-anchor="middle">
    <text x="275" y="56">cached</text><text x="475" y="56">cached</text><text x="665" y="56">cached</text>
  </g>

  <!-- naive poll: x = 200, 230, ... ; one lands in a fresh window -->
  <g fill="#c0392b">
    <rect x="200" y="92" width="14" height="14"/><rect x="230" y="92" width="14" height="14"/>
    <rect x="260" y="92" width="14" height="14"/><rect x="290" y="92" width="14" height="14"/>
    <rect x="320" y="92" width="14" height="14"/><rect x="400" y="92" width="14" height="14"/>
    <rect x="430" y="92" width="14" height="14"/><rect x="460" y="92" width="14" height="14"/>
    <rect x="490" y="92" width="14" height="14"/><rect x="520" y="92" width="14" height="14"/>
    <rect x="600" y="92" width="14" height="14"/><rect x="630" y="92" width="14" height="14"/>
    <rect x="660" y="92" width="14" height="14"/><rect x="690" y="92" width="14" height="14"/>
  </g>
  <rect x="368" y="92" width="14" height="14" fill="#3b6ea5"/>
  <rect x="568" y="92" width="14" height="14" fill="#3b6ea5"/>

  <!-- host: transfers then 25 ms delay -->
  <g stroke="#ffffff">
    <rect x="160" y="140" width="30" height="24" fill="#e0a030"/><rect x="190" y="140" width="170" height="24" fill="url(#idle)"/>
    <rect x="360" y="140" width="30" height="24" fill="#e0a030"/><rect x="390" y="140" width="170" height="24" fill="url(#idle)"/>
    <rect x="560" y="140" width="30" height="24" fill="#e0a030"/><rect x="590" y="140" width="150" height="24" fill="url(#idle)"/>
  </g>
  <g fill="#5a5a5a" font-size="11" text-anchor="middle">
    <text x="275" y="156">delay</text><text x="475" y="156">delay</text><text x="665" y="156">delay</text>
  </g>

  <!-- profiler: sample then wait -->
  <g stroke="#ffffff">
    <rect x="160" y="188" width="30" height="24" fill="#3b6ea5"/><rect x="190" y="188" width="170" height="24" fill="url(#idle)"/>
    <rect x="360" y="188" width="30" height="24" fill="#3b6ea5"/><rect x="390" y="188" width="170" height="24" fill="url(#idle)"/>
    <rect x="560" y="188" width="30" height="24" fill="#3b6ea5"/><rect x="590" y="188" width="150" height="24" fill="url(#idle)"/>
  </g>
  <g fill="#5a5a5a" font-size="11" text-anchor="middle">
    <text x="275" y="204">wait</text><text x="475" y="204">wait</text><text x="665" y="204">wait</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#1a1a1a">
    <rect x="20" y="238" width="12" height="12" fill="#1f4470"/><text x="38" y="248">fresh counter value</text>
    <rect x="160" y="238" width="12" height="12" fill="#3b6ea5"/><text x="178" y="248">fresh sample</text>
    <rect x="270" y="238" width="12" height="12" fill="#c0392b"/><text x="288" y="248">cached duplicate</text>
    <rect x="395" y="238" width="12" height="12" fill="#e0a030"/><text x="413" y="248">transfer</text>
    <rect x="475" y="238" width="12" height="12" fill="url(#idle)" stroke="#b5b5b5"/><text x="493" y="248">cached / idle</text>
  </g>
  <text x="20" y="282" font-size="10" fill="#5a5a5a">Schematic, not measured. Only the 25 ms delay is from the text; window widths are illustrative.</text>
</svg>
