<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Lambda joins the private Tailscale mesh with a pre-auth key; the home hook binds the Tailscale IPv4 only; no port forward or Funnel">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0a030"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>

  <!-- zones -->
  <g fill="none" stroke="#9a9a9a" stroke-dasharray="4 3">
    <rect x="20" y="20" width="720" height="110" rx="6"/>
    <rect x="20" y="190" width="720" height="150" rx="6"/>
  </g>
  <g font-size="11" fill="#5a5a5a">
    <text x="30" y="36">Public internet</text>
    <text x="30" y="206">Private Tailscale mesh</text>
  </g>

  <!-- public nodes -->
  <rect x="60" y="56" width="100" height="44" rx="4" fill="#ffffff" stroke="#1a1a1a"/>
  <rect x="230" y="56" width="120" height="44" rx="4" fill="#3b6ea5"/>
  <rect x="440" y="56" width="190" height="44" rx="4" fill="#3b6ea5"/>
  <text x="110" y="82" text-anchor="middle" fill="#1a1a1a">Echo</text>
  <g fill="#ffffff" text-anchor="middle">
    <text x="290" y="82">Alexa / AWS</text>
    <text x="535" y="75">Lambda + tailscaled</text><text x="535" y="91" font-size="11">node: aws-lambda-app</text>
  </g>
  <g stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="160" y1="78" x2="228" y2="78"/>
    <line x1="350" y1="78" x2="438" y2="78"/>
  </g>

  <!-- join -->
  <line x1="535" y1="100" x2="535" y2="226" stroke="#e0a030" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrT)"/>
  <text x="545" y="160" font-size="11" fill="#a06d10">joins with pre-auth key</text>

  <!-- blocked public path -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="110" y1="100" x2="110" y2="186" stroke-dasharray="5 3"/>
    <line x1="100" y1="150" x2="120" y2="170"/><line x1="120" y1="150" x2="100" y2="170"/>
  </g>
  <text x="128" y="158" font-size="11" fill="#c0392b">no port forward,</text>
  <text x="128" y="172" font-size="11" fill="#c0392b">no Funnel</text>

  <!-- mesh nodes -->
  <rect x="475" y="228" width="120" height="36" rx="4" fill="#ffffff" stroke="#1f4470" stroke-width="1.5"/>
  <rect x="200" y="280" width="190" height="44" rx="4" fill="#1f4470"/>
  <rect x="475" y="288" width="240" height="40" rx="4" fill="#1f4470"/>
  <text x="535" y="250" text-anchor="middle" fill="#1f4470">Tailnet</text>
  <g fill="#ffffff" text-anchor="middle">
    <text x="295" y="299">Home hook :8771</text><text x="295" y="315" font-size="11">binds Tailscale IPv4 only</text>
    <text x="595" y="312">Home server: MCP hub, vault, Notion</text>
  </g>
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M475,246 C420,246 340,250 310,278"/>
    <line x1="390" y1="308" x2="473" y2="308"/>
  </g>
  <text x="432" y="300" font-size="11" text-anchor="middle" fill="#5a5a5a">Bearer</text>

  <text x="20" y="364" font-size="10" fill="#5a5a5a">Schematic, not measured. The hook keeps the shared secret and API tokens on the server; no TLS on the private hop.</text>
</svg>
