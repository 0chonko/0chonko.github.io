<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Pipeline: binary change mask, OpenCV contour, ordered concave hull in lat/lon, GeoJSON Feature">
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse" x="30" y="60">
      <rect width="12" height="12" fill="#f4f4f4" stroke="#d6d6d6" stroke-width="0.5"/>
    </pattern>
    <g id="blob">
      <rect x="30" y="60" width="96" height="96" fill="url(#grid)" stroke="#1a1a1a"/>
      <g fill="#3b6ea5">
        <rect x="54" y="72" width="36" height="12"/><rect x="42" y="84" width="60" height="12"/>
        <rect x="42" y="96" width="72" height="12"/><rect x="54" y="108" width="60" height="12"/>
        <rect x="66" y="120" width="36" height="12"/><rect x="78" y="132" width="12" height="12"/>
      </g>
    </g>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="250" fill="#ffffff"/>

  <!-- 1. mask -->
  <use href="#blob"/>

  <!-- 2. contour on pixel edges -->
  <g transform="translate(180,0)">
    <use href="#blob" opacity="0.35"/>
    <path d="M54,72H90V84H102V96H114V120H102V132H90V144H78V132H66V120H54V108H42V84H54Z" fill="none" stroke="#e0a030" stroke-width="2.5"/>
  </g>

  <!-- 3. ordered concave hull -->
  <g transform="translate(360,0)">
    <rect x="30" y="60" width="96" height="96" fill="#ffffff" stroke="#1a1a1a"/>
    <polygon points="56,74 90,74 112,98 112,120 90,142 66,126 44,106 44,86" fill="#3b6ea5" fill-opacity="0.25" stroke="#1f4470" stroke-width="2"/>
    <g fill="#1f4470">
      <circle cx="56" cy="74" r="2.5"/><circle cx="90" cy="74" r="2.5"/><circle cx="112" cy="98" r="2.5"/><circle cx="112" cy="120" r="2.5"/>
      <circle cx="90" cy="142" r="2.5"/><circle cx="66" cy="126" r="2.5"/><circle cx="44" cy="106" r="2.5"/><circle cx="44" cy="86" r="2.5"/>
    </g>
    <path d="M74,108h8M78,104v8" stroke="#c0392b" stroke-width="1.5"/>
  </g>

  <!-- 4. GeoJSON -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a">
    <rect x="540" y="60" width="205" height="104" fill="#f4f4f4" stroke="#1a1a1a"/>
    <text x="548" y="78">{"type": "Feature",</text>
    <text x="548" y="93"> "geometry": {"type": "Polygon",</text>
    <text x="548" y="108">   "coordinates": [[lon, lat], …]},</text>
    <text x="548" y="123"> "properties": {</text>
    <text x="548" y="138">   "class": "construction",</text>
    <text x="548" y="153">   "date": "2021-03-30"}}</text>
  </g>

  <g stroke="#1a1a1a" marker-end="url(#arr)">
    <line x1="132" y1="108" x2="204" y2="108"/><line x1="312" y1="108" x2="384" y2="108"/><line x1="492" y1="108" x2="534" y2="108"/>
  </g>

  <g fill="#1a1a1a" font-weight="600" font-size="12">
    <text x="30" y="40">1. CD mask tile</text><text x="210" y="40">2. Outer contour</text>
    <text x="390" y="40">3. Ordered hull</text><text x="540" y="40">4. GeoJSON Feature</text>
  </g>
  <g fill="#5a5a5a" font-size="11">
    <text x="30" y="176">256×256 binary, ~3 m/px</text>
    <text x="210" y="176">OpenCV findContours,</text><text x="210" y="190">RETR_EXTERNAL</text>
    <text x="390" y="176">pixel index to lat/lon,</text><text x="390" y="190">sort by angle around</text><text x="390" y="204">centroid, k-NN concave hull</text>
    <text x="540" y="176">collected into one</text><text x="540" y="190">FeatureCollection per date</text>
  </g>
  <text x="380" y="238" text-anchor="middle" font-size="11" fill="#5a5a5a">Output: Kepler.gl timeline, plus polygon centroids as CSV for ArcGIS hotspot analysis. GeoJSON was 10–20× smaller than the raw masks.</text>
</svg>
