<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Decision flowchart: five yes/no questions leading to run natively, Basic Contained, shared memory without MPI, Optimized Contained, or Hybrid Model">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#ffffff"/>

  <!-- spine: questions at y = 70, 140, 210, 280, 350 (h 44) -->
  <rect x="40" y="16" width="320" height="30" rx="4" fill="#f1f1f1" stroke="#9a9a9a"/>
  <text x="200" y="36" text-anchor="middle" fill="#1a1a1a">Start: evaluate the HPC application</text>
  <g fill="#ffffff" stroke="#3b6ea5" stroke-width="1.5">
    <rect x="40" y="70" width="320" height="44" rx="22"/>
    <rect x="40" y="140" width="320" height="44" rx="22"/>
    <rect x="40" y="210" width="320" height="44" rx="22"/>
    <rect x="40" y="280" width="320" height="44" rx="22"/>
    <rect x="40" y="350" width="320" height="44" rx="22"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="200" y="96">Pure C/C++/Fortran, minimal dependencies?</text>
    <text x="200" y="166">Distributed with other containerized apps?</text>
    <text x="200" y="236">Scales to more than one compute node?</text>
    <text x="200" y="300">Does a ~10x latency/bandwidth hit</text><text x="200" y="314">hurt the app?</text>
    <text x="200" y="370">Can you replicate the host MPI</text><text x="200" y="384">from public repos?</text>
  </g>

  <!-- leaves -->
  <rect x="440" y="72" width="300" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a"/>
  <rect x="440" y="142" width="300" height="40" rx="4" fill="#3b6ea5"/>
  <rect x="440" y="212" width="300" height="40" rx="4" fill="#f1f1f1" stroke="#9a9a9a"/>
  <rect x="440" y="282" width="300" height="40" rx="4" fill="#3b6ea5"/>
  <rect x="440" y="352" width="300" height="40" rx="4" fill="#3b6ea5"/>
  <rect x="40" y="430" width="320" height="40" rx="4" fill="#1f4470"/>
  <text x="590" y="97" text-anchor="middle" fill="#1a1a1a">Don't containerize: run natively</text>
  <text x="590" y="237" text-anchor="middle" fill="#1a1a1a">Shared-memory parallelism; don't use MPI</text>
  <g fill="#ffffff" text-anchor="middle">
    <text x="590" y="167">Basic Contained</text>
    <text x="590" y="307">Basic Contained</text>
    <text x="590" y="377">Optimized Contained (Spack UCX/IB)</text>
    <text x="200" y="455">Hybrid Model (mount host MPI)</text>
  </g>

  <!-- edges -->
  <g stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="200" y1="46" x2="200" y2="68"/>
    <line x1="200" y1="114" x2="200" y2="138"/>
    <line x1="200" y1="184" x2="200" y2="208"/>
    <line x1="200" y1="254" x2="200" y2="278"/>
    <line x1="200" y1="324" x2="200" y2="348"/>
    <line x1="200" y1="394" x2="200" y2="428"/>
    <line x1="360" y1="92" x2="438" y2="92"/>
    <line x1="360" y1="162" x2="438" y2="162"/>
    <line x1="360" y1="232" x2="438" y2="232"/>
    <line x1="360" y1="302" x2="438" y2="302"/>
    <line x1="360" y1="372" x2="438" y2="372"/>
  </g>
  <g font-size="11" fill="#5a5a5a">
    <text x="384" y="86">yes</text><text x="384" y="156">yes</text><text x="384" y="226">no</text>
    <text x="384" y="296">no</text><text x="384" y="366">yes</text>
    <text x="208" y="130">no</text><text x="208" y="200">no</text><text x="208" y="270">yes</text>
    <text x="208" y="340">yes</text><text x="208" y="416">no</text>
  </g>

  <text x="440" y="455" font-size="11" fill="#5a5a5a">Hybrid: near-native speed, weak portability.</text>
  <text x="20" y="492" font-size="10" fill="#5a5a5a">Schematic, not measured.</text>
</svg>
