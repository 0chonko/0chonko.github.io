<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Timeline of three ranks: bulk-synchronous loop finishes at t=30, GASPI dataflow loop finishes at t=19 with the same work">
  <defs>
    <pattern id="idle" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f1f1f1"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b5b5b5" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="760" height="385" fill="#ffffff"/>

  <!-- A: bulk-synchronous. Barriers at t=12 and t=30 -->
  <text x="20" y="24" font-weight="600" fill="#1a1a1a">A. Bulk-synchronous: communicate, barrier, compute, barrier</text>
  <g fill="#1a1a1a" text-anchor="end">
    <text x="90" y="56">Rank 0</text><text x="90" y="88">Rank 1</text><text x="90" y="120">Rank N</text>
  </g>
  <g stroke="#ffffff">
    <rect x="100" y="41" width="240" height="22" fill="#e0a030"/>
    <rect x="340" y="41" width="320" height="22" fill="#3b6ea5"/>
    <rect x="660" y="41" width="40" height="22" fill="url(#idle)"/>

    <rect x="100" y="73" width="200" height="22" fill="#e0a030"/>
    <rect x="300" y="73" width="40" height="22" fill="url(#idle)"/>
    <rect x="340" y="73" width="200" height="22" fill="#3b6ea5"/>
    <rect x="540" y="73" width="160" height="22" fill="url(#idle)"/>

    <rect x="100" y="105" width="120" height="22" fill="#e0a030"/>
    <rect x="220" y="105" width="120" height="22" fill="url(#idle)"/>
    <rect x="340" y="105" width="360" height="22" fill="#3b6ea5"/>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="220" y="56">communicate</text><text x="500" y="56">compute</text>
    <text x="200" y="88">communicate</text><text x="440" y="88">compute</text>
    <text x="160" y="120">comm</text><text x="520" y="120">compute</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3">
    <line x1="340" y1="34" x2="340" y2="134"/><line x1="700" y1="34" x2="700" y2="134"/>
  </g>
  <g fill="#c0392b" font-size="11" text-anchor="middle">
    <text x="340" y="148">barrier</text><text x="700" y="148">barrier</text>
  </g>

  <!-- B: GASPI dataflow. Same per-rank work; NIC lane under each rank -->
  <text x="20" y="184" font-weight="600" fill="#1a1a1a">B. GASPI dataflow: post writes, compute inner cells, wait only on neighbour notifications</text>
  <g fill="#1a1a1a" text-anchor="end">
    <text x="90" y="214">Rank 0</text><text x="90" y="250">Rank 1</text><text x="90" y="286">Rank N</text>
  </g>
  <g stroke="#ffffff">
    <rect x="100" y="200" width="20" height="18" fill="#e0a030"/>
    <rect x="120" y="200" width="280" height="18" fill="#3b6ea5"/>
    <rect x="400" y="200" width="40" height="18" fill="#1f4470"/>
    <rect x="100" y="220" width="240" height="5" fill="#e0a030" opacity="0.6"/>

    <rect x="100" y="236" width="20" height="18" fill="#e0a030"/>
    <rect x="120" y="236" width="160" height="18" fill="#3b6ea5"/>
    <rect x="280" y="236" width="60" height="18" fill="url(#idle)"/>
    <rect x="340" y="236" width="40" height="18" fill="#1f4470"/>
    <rect x="100" y="256" width="200" height="5" fill="#e0a030" opacity="0.6"/>

    <rect x="100" y="272" width="20" height="18" fill="#e0a030"/>
    <rect x="120" y="272" width="320" height="18" fill="#3b6ea5"/>
    <rect x="440" y="272" width="40" height="18" fill="#1f4470"/>
    <rect x="100" y="292" width="120" height="5" fill="#e0a030" opacity="0.6"/>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="260" y="213">inner cells</text>
    <text x="200" y="249">inner cells</text>
    <text x="280" y="285">inner cells</text>
  </g>
  <text x="310" y="249" font-size="10" text-anchor="middle" fill="#5a5a5a">wait</text>
  <g fill="#1a1a1a" font-size="11">
    <text x="448" y="213">done t=17</text><text x="388" y="249">done t=14</text><text x="488" y="285">done t=19</text>
  </g>

  <!-- axis: x = 100 + 20 t -->
  <g stroke="#1a1a1a"><line x1="100" y1="310" x2="700" y2="310"/></g>
  <g stroke="#1a1a1a">
    <line x1="100" y1="310" x2="100" y2="314"/><line x1="200" y1="310" x2="200" y2="314"/><line x1="300" y1="310" x2="300" y2="314"/>
    <line x1="400" y1="310" x2="400" y2="314"/><line x1="500" y1="310" x2="500" y2="314"/><line x1="600" y1="310" x2="600" y2="314"/><line x1="700" y1="310" x2="700" y2="314"/>
  </g>
  <g fill="#5a5a5a" font-size="11" text-anchor="middle">
    <text x="100" y="326">0</text><text x="200" y="326">5</text><text x="300" y="326">10</text><text x="400" y="326">15</text>
    <text x="500" y="326">20</text><text x="600" y="326">25</text><text x="700" y="326">30</text>
  </g>
  <text x="715" y="326" fill="#5a5a5a" font-size="11">time</text>

  <!-- legend -->
  <g font-size="11" fill="#1a1a1a">
    <rect x="20" y="342" width="12" height="12" fill="#e0a030"/><text x="38" y="352">transfer / post</text>
    <rect x="140" y="342" width="12" height="12" fill="#3b6ea5"/><text x="158" y="352">compute</text>
    <rect x="225" y="342" width="12" height="12" fill="#1f4470"/><text x="243" y="352">boundary cells</text>
    <rect x="340" y="342" width="12" height="12" fill="url(#idle)" stroke="#b5b5b5"/><text x="358" y="352">idle</text>
    <rect x="400" y="346" width="12" height="5" fill="#e0a030" opacity="0.6"/><text x="418" y="352">NIC transfer in background</text>
  </g>
  <text x="20" y="374" font-size="10" fill="#5a5a5a">Schematic, not measured. Same per-rank work in A and B. B assumes transfers fully overlap compute.</text>
</svg>
