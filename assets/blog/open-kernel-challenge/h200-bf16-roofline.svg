<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="H200 BF16 roofline for dense projections: arithmetic intensity versus attainable performance">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="20" y="28" font-weight="600" fill="#1a1a1a">H200 BF16 roofline: dense projections (weight-streaming view)</text>
  <text x="20" y="48" fill="#5a5a5a">Peak HBM ~4.8 TB/s · ridge ~200 FLOP/byte · intensity ≈ m when weights dominate. Log–log axes.</text>

  <!-- plot frame -->
  <rect x="70" y="70" width="520" height="280" fill="#fafafa" stroke="#e6e6e6"/>

  <!-- grid (log intensity 0.5..512, log perf approx) -->
  <g stroke="#eee" stroke-width="1">
    <line x1="70" y1="280" x2="590" y2="280"/>
    <line x1="70" y1="210" x2="590" y2="210"/>
    <line x1="70" y1="140" x2="590" y2="140"/>
    <line x1="180" y1="70" x2="180" y2="350"/>
    <line x1="290" y1="70" x2="290" y2="350"/>
    <line x1="400" y1="70" x2="400" y2="350"/>
    <line x1="510" y1="70" x2="510" y2="350"/>
  </g>

  <!--
    x: log2(I), I from 0.5 to 512 → map 70..590
    x(I) = 70 + (log2(I)-log2(0.5))/(log2(512)-log2(0.5)) * 520
         = 70 + (log2(I)+1)/10 * 520
    Roof: mem branch y from BW*I until ridge; then flat peak.
    Peak ~990 TFLOPS, BW 4.8 TB/s = 4.8e12 B/s → at I=1: 4.8 TFLOPS
    y: log perf from ~0.5 to ~2000 TFLOPS
    y(P) = 350 - (log2(P)-log2(0.5))/12 * 280
  -->

  <!-- memory roof + compute roof -->
  <path d="M70 318 L400 88 L590 88" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="410" y="80" fill="#1a1a1a" font-weight="600">peak ~990 TFLOPS</text>
  <text x="189" y="210" fill="#1a1a1a" transform="rotate(-32 189 210)" font-weight="600">HBM ~4.8 TB/s</text>
  <line x1="400" y1="70" x2="400" y2="350" stroke="#b5b5b5" stroke-dasharray="4 3"/>
  <text x="400" y="64" text-anchor="middle" fill="#555">ridge ≈ 200</text>

  <!-- operating points on roof: memory branch y = 318 - (x-70)*230/330 -->
  <!-- m=1: I=1 → x=122; on roof → y≈282 -->
  <circle cx="122" cy="282" r="8" fill="#3b6ea5" stroke="#fff" stroke-width="2"/>
  <text x="122" y="304" text-anchor="middle" fill="#1a1a1a" font-weight="600">m=1</text>
  <text x="122" y="318" text-anchor="middle" fill="#5a5a5a">all 5 layers</text>

  <!-- m=16: I=16 → x=330; on roof → y≈137 -->
  <circle cx="330" cy="137" r="8" fill="#3b6ea5" stroke="#fff" stroke-width="2"/>
  <text x="330" y="120" text-anchor="middle" fill="#1a1a1a" font-weight="600">m=16</text>

  <!-- m=32: I=32 → x=382; on roof → y≈101 -->
  <circle cx="382" cy="101" r="7" fill="#3b6ea5" stroke="#fff" stroke-width="2"/>
  <text x="382" y="86" text-anchor="middle" fill="#1a1a1a">m=32</text>

  <!-- m=256 verify: I=256 → x=538; on compute roof -->
  <circle cx="538" cy="88" r="8" fill="#e0a030" stroke="#fff" stroke-width="2"/>
  <text x="538" y="72" text-anchor="middle" fill="#1a1a1a" font-weight="600">m=256</text>
  <text x="538" y="108" text-anchor="middle" fill="#5a5a5a">verify</text>

  <!-- failed rewrite cluster under m=16 roof -->
  <circle cx="312" cy="175" r="5" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="330" cy="182" r="5" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="348" cy="178" r="5" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="280" y="198" fill="#c0392b">CUTLASS / WGMMA / Triton</text>
  <text x="280" y="212" fill="#c0392b">rewrites (below nvjet)</text>

  <!-- axes -->
  <line x1="70" y1="350" x2="590" y2="350" stroke="#1a1a1a"/>
  <line x1="70" y1="70" x2="70" y2="350" stroke="#1a1a1a"/>
  <g fill="#555" text-anchor="middle">
    <text x="122" y="368">1</text>
    <text x="226" y="368">4</text>
    <text x="330" y="368">16</text>
    <text x="400" y="368">200</text>
    <text x="538" y="368">256</text>
    <text x="330" y="388">arithmetic intensity (FLOP/byte) ≈ m</text>
  </g>
  <g fill="#555" text-anchor="end">
    <text x="64" y="354">0.5</text>
    <text x="64" y="284">8</text>
    <text x="64" y="214">64</text>
    <text x="64" y="144">512</text>
    <text x="64" y="92">2k</text>
  </g>
  <text x="22" y="230" fill="#555" transform="rotate(-90 22 230)">attainable TFLOPS</text>

  <!-- legend -->
  <g transform="translate(610, 90)">
    <text x="0" y="0" font-weight="600" fill="#1a1a1a">Legend</text>
    <circle cx="8" cy="24" r="6" fill="#3b6ea5"/>
    <text x="22" y="28" fill="#1a1a1a">decode loads</text>
    <circle cx="8" cy="48" r="6" fill="#e0a030"/>
    <text x="22" y="52" fill="#1a1a1a">verify (wide m)</text>
    <circle cx="8" cy="72" r="5" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="22" y="76" fill="#1a1a1a">failed rewrites</text>
    <text x="0" y="108" font-weight="600" fill="#1a1a1a" font-size="11">Weight bytes → floor</text>
    <text x="0" y="126" fill="#5a5a5a" font-size="11">qkv_gate 36 MiB 7.9 µs</text>
    <text x="0" y="142" fill="#5a5a5a" font-size="11">o        16 MiB 3.5 µs</text>
    <text x="0" y="158" fill="#5a5a5a" font-size="11">pooler   64 MiB 14.0 µs</text>
    <text x="0" y="174" fill="#5a5a5a" font-size="11">unpooler 1.7–14 µs</text>
    <text x="0" y="190" fill="#5a5a5a" font-size="11">router     8 MiB 1.7 µs</text>
    <text x="0" y="214" fill="#5a5a5a" font-size="11">Math floor ≤ 0.1 µs at m=1.</text>
    <text x="0" y="230" fill="#5a5a5a" font-size="11">Tip moved tax, not the roof.</text>
  </g>

  <text x="20" y="410" fill="#5a5a5a">Schematic: points sit on the memory branch for thin m. Only large verify shapes approach the compute roof.</text>
</svg>
