<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Scoreboard of all Open Kernel Challenge experiments as percent change versus SGLang">
