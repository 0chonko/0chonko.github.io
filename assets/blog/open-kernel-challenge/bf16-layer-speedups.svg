<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="BF16 tip percent change per layer at decode batch 1 versus SGLang">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-weight="600" fill="#1a1a1a">muse_bf16_proj tip: percent change vs SGLang at decode m=1</text>
  <text x="20" y="48" fill="#5a5a5a">Geo-mean tip +43% (CI +40% to +45%). Bars are the five scored layers on the decode-1 load.</text>

  <line x1="80" y1="280" x2="700" y2="280" stroke="#e6e6e6"/>
  <line x1="80" y1="80" x2="80" y2="280" stroke="#e6e6e6"/>
  <line x1="80" y1="200" x2="700" y2="200" stroke="#b5b5b5" stroke-dasharray="4 3"/>
  <line x1="80" y1="160" x2="700" y2="160" stroke="#e6e6e6"/>
  <line x1="80" y1="120" x2="700" y2="120" stroke="#e6e6e6"/>
  <line x1="80" y1="80" x2="700" y2="80" stroke="#e6e6e6"/>
  <text x="72" y="204" text-anchor="end" fill="#555">0%</text>
  <text x="72" y="164" text-anchor="end" fill="#555">+50%</text>
  <text x="72" y="124" text-anchor="end" fill="#555">+100%</text>
  <text x="72" y="84" text-anchor="end" fill="#555">+150%</text>

  <!-- y = 280 - speedup*80; 1.0→200 (=0%), 1.5→160, 2.0→120, 2.5→80 -->
  <rect x="120" y="166.96" width="70" height="113.04" fill="#3b6ea5"/>
  <text x="155" y="158" text-anchor="middle" font-weight="600" fill="#1a1a1a">+41%</text>
  <text x="155" y="300" text-anchor="middle" fill="#1a1a1a">qkv_gate</text>

  <rect x="230" y="181.04" width="70" height="98.96" fill="#3b6ea5"/>
  <text x="265" y="172" text-anchor="middle" font-weight="600" fill="#1a1a1a">+24%</text>
  <text x="265" y="300" text-anchor="middle" fill="#1a1a1a">o</text>

  <rect x="340" y="157.52" width="70" height="122.48" fill="#3b6ea5"/>
  <text x="375" y="149" text-anchor="middle" font-weight="600" fill="#1a1a1a">+53%</text>
  <text x="375" y="300" text-anchor="middle" fill="#1a1a1a">pooler</text>

  <rect x="450" y="152.64" width="70" height="127.36" fill="#3b6ea5"/>
  <text x="485" y="144" text-anchor="middle" font-weight="600" fill="#1a1a1a">+59%</text>
  <text x="485" y="300" text-anchor="middle" fill="#1a1a1a">unpooler</text>

  <rect x="560" y="69.68" width="70" height="210.32" fill="#e0a030"/>
  <text x="595" y="61" text-anchor="middle" font-weight="600" fill="#1a1a1a">+163%</text>
  <text x="595" y="300" text-anchor="middle" fill="#1a1a1a">router</text>

  <text x="20" y="334" fill="#5a5a5a">Router is FP32 weights (hi/lo BF16 path in the tip). BF16 layers sit closer to the HBM floor; the geo-mean is pulled up by router.</text>
  <text x="20" y="352" fill="#5a5a5a">Dashed line at 0% = tie SGLang. Bar height uses speedup ratio (1.0 + pct/100).</text>
</svg>
