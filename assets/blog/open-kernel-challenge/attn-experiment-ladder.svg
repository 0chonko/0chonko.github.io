<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Attention decode experiment ladder as percent change versus SGLang">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-weight="600" fill="#1a1a1a">muse_attention_decode: experiment ladder (% vs SGLang)</text>
  <text x="20" y="48" fill="#5a5a5a">Selected submits from the attention log. Tip was +15% (CI +13% to +17%).</text>

  <line x1="260" y1="70" x2="260" y2="360" stroke="#e6e6e6"/>
  <line x1="260" y1="360" x2="720" y2="360" stroke="#e6e6e6"/>
  <line x1="420" y1="70" x2="420" y2="360" stroke="#b5b5b5" stroke-dasharray="4 3"/>
  <text x="420" y="66" text-anchor="middle" fill="#555">0%</text>

  <!-- x = 260 + speedup * 160 -->
  <text x="250" y="98" text-anchor="end" fill="#1a1a1a">Flash-Decoding splits</text>
  <rect x="260" y="84" width="157.6" height="20" fill="#c0392b"/>
  <text x="426" y="98" fill="#1a1a1a">−1%</text>

  <text x="250" y="132" text-anchor="end" fill="#1a1a1a">page_size=1 flatten</text>
  <rect x="260" y="118" width="159.2" height="20" fill="#c0392b"/>
  <text x="428" y="132" fill="#1a1a1a">~0%</text>

  <text x="250" y="166" text-anchor="end" fill="#1a1a1a">Sage-style FP8 Q</text>
  <rect x="260" y="152" width="164.96" height="20" fill="#e0a030"/>
  <text x="434" y="166" fill="#1a1a1a">+3%</text>

  <text x="250" y="200" text-anchor="end" fill="#1a1a1a">FA3 + fused prep/epi</text>
  <rect x="260" y="186" width="173.12" height="20" fill="#3b6ea5"/>
  <text x="442" y="200" fill="#1a1a1a">+8%</text>

  <text x="250" y="234" text-anchor="end" fill="#1a1a1a">Hybrid fuse + Sage</text>
  <rect x="260" y="220" width="172.64" height="20" fill="#3b6ea5"/>
  <text x="442" y="234" fill="#1a1a1a">+8%</text>

  <text x="250" y="268" text-anchor="end" fill="#1a1a1a">ThunderKittens tiles</text>
  <rect x="260" y="254" width="175.36" height="20" fill="#3b6ea5"/>
  <text x="444" y="268" fill="#1a1a1a">+10%</text>

  <text x="250" y="302" text-anchor="end" font-weight="600" fill="#1a1a1a">Tip submit</text>
  <rect x="260" y="288" width="183.84" height="20" fill="#3b6ea5"/>
  <text x="452" y="302" font-weight="600" fill="#1a1a1a">+15%</text>

  <text x="250" y="336" text-anchor="end" fill="#1a1a1a">Custom Triton mega-fuse</text>
  <rect x="260" y="322" width="71.2" height="20" fill="#c0392b"/>
  <text x="340" y="336" fill="#1a1a1a">−55%</text>

  <text x="20" y="386" fill="#5a5a5a">Every positive run still spent ~95%+ inside FA3 Cutlass. Wins came from fused prep/epilogue and tile sizing, not a new attend kernel.</text>
</svg>
