<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Sequence of a cache miss on the shared bus: CPU request, bus queue, snoop of other caches, memory access, response">
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrT" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0a030"/>
    </marker>
    <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="760" height="405" fill="#ffffff"/>
  <text x="20" y="24" font-weight="600" fill="#1a1a1a">One miss on the shared bus (V-I protocol)</text>

  <g fill="#1f4470">
    <rect x="30" y="40" width="120" height="34"/><rect x="170" y="40" width="120" height="34"/>
    <rect x="320" y="40" width="120" height="34"/><rect x="480" y="40" width="120" height="34"/>
    <rect x="620" y="40" width="120" height="34"/>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="90" y="62">CPU</text><text x="230" y="62">Cache</text><text x="380" y="62">Bus</text>
    <text x="540" y="62">Other caches</text><text x="680" y="62">Memory</text>
  </g>
  <g stroke="#b5b5b5" stroke-dasharray="4 3">
    <line x1="90" y1="74" x2="90" y2="360"/><line x1="230" y1="74" x2="230" y2="360"/>
    <line x1="380" y1="74" x2="380" y2="360"/><line x1="540" y1="74" x2="540" y2="360"/><line x1="680" y1="74" x2="680" y2="360"/>
  </g>
  <rect x="372" y="140" width="16" height="205" fill="#3b6ea5"/>

  <g stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="90" y1="110" x2="229" y2="110"/>
    <line x1="230" y1="150" x2="371" y2="150"/>
  </g>
  <line x1="388" y1="195" x2="539" y2="195" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrB)"/>
  <g stroke="#e0a030" stroke-width="1.5" marker-end="url(#arrT)">
    <line x1="388" y1="245" x2="679" y2="245"/>
    <line x1="680" y1="295" x2="389" y2="295" stroke-dasharray="5 3"/>
    <line x1="372" y1="335" x2="231" y2="335" stroke-dasharray="5 3"/>
  </g>

  <g fill="#1a1a1a" text-anchor="middle">
    <text x="160" y="104">read / write</text>
    <text x="300" y="144">request on miss</text>
    <text x="464" y="189">snoop</text>
    <text x="534" y="239" stroke="#ffffff" stroke-width="4" paint-order="stroke">read / write if no cache supplies data</text>
    <text x="534" y="289">response</text>
    <text x="300" y="329">response</text>
  </g>
  <g font-size="10" fill="#5a5a5a" text-anchor="middle">
    <text x="160" y="124">cpu_cache_if</text>
    <text x="300" y="164">bus_slave_if</text>
    <text x="464" y="209">invalidate on write</text>
    <text x="534" y="259">bus_slave_if</text>
  </g>
  <text x="396" y="136" font-size="10" fill="#3b6ea5">FIFO queue</text>

  <g font-size="11" fill="#1a1a1a">
    <rect x="20" y="372" width="12" height="12" fill="#3b6ea5"/><text x="38" y="382">bus busy (arbiter)</text>
    <rect x="150" y="377" width="16" height="3" fill="#c0392b"/><text x="172" y="382">snoop / invalidate (bus_master_if)</text>
    <rect x="370" y="377" width="16" height="3" fill="#e0a030"/><text x="392" y="382">memory traffic</text>
  </g>
  <text x="20" y="398" font-size="10" fill="#5a5a5a">Schematic, not measured.</text>
</svg>
