<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Heat diffusion access patterns: a row sweep with the 5-point stencil, the same grid traversed in tiles, and OpenMP chunk boundaries that split or respect 32-byte cache lines">
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 L0,20" fill="none" stroke="#d0d0d0"/>
    </pattern>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="20" y="24" font-weight="600" fill="#1a1a1a">Three ways to walk the same grid</text>

  <text x="130" y="52" text-anchor="middle" font-weight="600" fill="#1a1a1a">Row sweep (naive)</text>
  <rect x="50" y="64" width="160" height="160" fill="url(#g)" stroke="#b5b5b5"/>
  <g fill="#f6dca8"><rect x="110" y="124" width="20" height="20"/><rect x="90" y="144" width="20" height="20"/><rect x="130" y="144" width="20" height="20"/><rect x="110" y="164" width="20" height="20"/></g>
  <rect x="110" y="144" width="20" height="20" fill="#e0a030"/>
  <g stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="54" y1="74" x2="204" y2="74"/><line x1="54" y1="94" x2="204" y2="94"/><line x1="54" y1="114" x2="204" y2="114"/>
  </g>
  <g fill="#555" text-anchor="middle" font-size="11">
    <text x="130" y="246">Each cell reads up, down, left, right.</text>
    <text x="130" y="262">On a wide grid the row above was</text>
    <text x="130" y="278">evicted before the row below needs it.</text>
  </g>

  <text x="380" y="52" text-anchor="middle" font-weight="600" fill="#1a1a1a">Tiled</text>
  <rect x="300" y="64" width="160" height="160" fill="url(#g)" stroke="#b5b5b5"/>
  <rect x="300" y="64" width="80" height="80" fill="#d6e4f2"/>
  <rect x="300" y="64" width="160" height="160" fill="none" stroke="#b5b5b5"/>
  <g stroke="#1f4470" stroke-width="2.5"><line x1="380" y1="64" x2="380" y2="224"/><line x1="300" y1="144" x2="460" y2="144"/></g>
  <g fill="#1f4470" font-weight="600" text-anchor="middle" font-size="14">
    <text x="340" y="109">1</text><text x="420" y="109">2</text><text x="340" y="189">3</text><text x="420" y="189">4</text>
  </g>
  <g fill="#555" text-anchor="middle" font-size="11">
    <text x="380" y="246">Finish one block before the next.</text>
    <text x="380" y="262">A 16×16 block of doubles plus its halo</text>
    <text x="380" y="278">stays in the 32 kB L1 while it is reused.</text>
  </g>

  <text x="625" y="52" text-anchor="middle" font-weight="600" fill="#1a1a1a">OpenMP chunks vs. lines</text>
  <text x="520" y="80" fill="#1a1a1a" font-size="11">default chunking</text>
  <g stroke="#ffffff">
    <rect x="520" y="88" width="26" height="26" fill="#3b6ea5"/><rect x="546" y="88" width="26" height="26" fill="#3b6ea5"/><rect x="572" y="88" width="26" height="26" fill="#3b6ea5"/><rect x="598" y="88" width="26" height="26" fill="#3b6ea5"/>
    <rect x="624" y="88" width="26" height="26" fill="#3b6ea5"/><rect x="650" y="88" width="26" height="26" fill="#3b6ea5"/><rect x="676" y="88" width="26" height="26" fill="#e0a030"/><rect x="702" y="88" width="26" height="26" fill="#e0a030"/>
  </g>
  <rect x="624" y="86" width="104" height="30" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="676" y="132" text-anchor="middle" fill="#c0392b" font-size="11">one line, two writers</text>

  <text x="520" y="164" fill="#1a1a1a" font-size="11">chunk = whole lines</text>
  <g stroke="#ffffff">
    <rect x="520" y="172" width="26" height="26" fill="#3b6ea5"/><rect x="546" y="172" width="26" height="26" fill="#3b6ea5"/><rect x="572" y="172" width="26" height="26" fill="#3b6ea5"/><rect x="598" y="172" width="26" height="26" fill="#3b6ea5"/>
    <rect x="624" y="172" width="26" height="26" fill="#e0a030"/><rect x="650" y="172" width="26" height="26" fill="#e0a030"/><rect x="676" y="172" width="26" height="26" fill="#e0a030"/><rect x="702" y="172" width="26" height="26" fill="#e0a030"/>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5"><rect x="520" y="172" width="104" height="26"/><rect x="624" y="172" width="104" height="26"/></g>
  <g fill="#555" text-anchor="middle" font-size="11">
    <text x="625" y="246">4 doubles per 32-byte line.</text>
    <text x="625" y="262">A chunk boundary inside a line makes</text>
    <text x="625" y="278">every write invalidate the other core.</text>
  </g>

  <rect x="520" y="300" width="12" height="12" fill="#3b6ea5"/><text x="538" y="310" fill="#1a1a1a" font-size="11">thread 0</text>
  <rect x="600" y="300" width="12" height="12" fill="#e0a030"/><text x="618" y="310" fill="#1a1a1a" font-size="11">thread 1</text>
  <rect x="50" y="300" width="12" height="12" fill="#e0a030"/><text x="68" y="310" fill="#1a1a1a" font-size="11">cell being updated, with its 4 neighbours</text>
</svg>
