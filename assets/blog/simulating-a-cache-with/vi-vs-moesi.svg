<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="State machines for one cache line: V-I with two states versus MOESI with five, showing which local and snooped events move a line between states">
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrT" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0a030"/>
    </marker>
    <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="20" y="24" font-weight="600" fill="#1a1a1a">One cache line, two protocols</text>
  <line x1="300" y1="40" x2="300" y2="400" stroke="#e6e6e6"/>

  <text x="150" y="50" text-anchor="middle" font-weight="600" fill="#1a1a1a">V-I (write-through)</text>
  <path d="M136,128 C100,70 200,70 164,128" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="150" y="70" text-anchor="middle" fill="#c0392b">local write: also sent to memory</text>
  <line x1="128" y1="296" x2="128" y2="176" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="172" y1="176" x2="172" y2="296" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <g fill="#1f4470"><circle cx="150" cy="150" r="26"/><circle cx="150" cy="322" r="26"/></g>
  <g fill="#ffffff" text-anchor="middle" font-weight="600"><text x="150" y="155">V</text><text x="150" y="327">I</text></g>
  <g fill="#1a1a1a" text-anchor="end"><text x="120" y="232">miss:</text><text x="120" y="248">fetch from</text><text x="120" y="264">memory</text></g>
  <g fill="#1a1a1a"><text x="180" y="232">remote write</text><text x="180" y="248">snooped</text></g>
  <g fill="#555" text-anchor="middle" font-size="11">
    <text x="150" y="372">Memory is always up to date,</text>
    <text x="150" y="387">so every write costs a bus trip.</text>
  </g>

  <text x="530" y="50" text-anchor="middle" font-weight="600" fill="#1a1a1a">MOESI (write-back)</text>
  <line x1="476" y1="102" x2="638" y2="102" stroke="#e0a030" stroke-width="2" marker-end="url(#arrT)"/>
  <text x="560" y="76" text-anchor="middle" fill="#a06d10">remote read: send data cache-to-cache</text>
  <line x1="642" y1="122" x2="480" y2="122" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="530" y="142" fill="#1a1a1a">local write</text>
  <line x1="450" y1="204" x2="450" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <g fill="#1a1a1a"><text x="460" y="168">local write,</text><text x="460" y="184">no bus traffic</text></g>
  <line x1="650" y1="214" x2="472" y2="126" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <g fill="#1a1a1a"><text x="600" y="164">local write:</text><text x="600" y="180">invalidate others</text></g>
  <line x1="540" y1="310" x2="470" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <g fill="#1a1a1a" text-anchor="end"><text x="494" y="300">read miss,</text><text x="494" y="316">no other copy</text></g>
  <line x1="580" y1="310" x2="650" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <g fill="#1a1a1a"><text x="626" y="300">read miss,</text><text x="626" y="316">others hold it</text></g>
  <path d="M534,336 Q360,350 428,124" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="262" fill="#1a1a1a" text-anchor="middle">write</text>
  <text x="372" y="278" fill="#1a1a1a" text-anchor="middle">miss</text>
  <g fill="#1f4470">
    <circle cx="450" cy="112" r="26"/><circle cx="670" cy="112" r="26"/>
    <circle cx="450" cy="230" r="26"/><circle cx="670" cy="230" r="26"/>
    <circle cx="560" cy="330" r="26"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="450" y="117">M</text><text x="670" y="117">O</text>
    <text x="450" y="235">E</text><text x="670" y="235">S</text><text x="560" y="335">I</text>
  </g>

  <g font-size="11" fill="#1a1a1a">
    <text x="320" y="392"><tspan font-weight="600">M</tspan> dirty, only copy</text>
    <text x="440" y="392"><tspan font-weight="600">O</tspan> dirty, shared, owner answers reads</text>
    <text x="320" y="410"><tspan font-weight="600">E</tspan> clean, only copy</text>
    <text x="440" y="410"><tspan font-weight="600">S</tspan> shared, someone else may own it</text>
    <text x="320" y="428"><tspan font-weight="600">I</tspan> not present</text>
    <text x="440" y="428" fill="#555">Not drawn: any state → I on a snooped write;</text>
    <text x="440" y="444" fill="#555">M and O write back to memory on eviction.</text>
  </g>
</svg>
